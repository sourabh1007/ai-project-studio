name: Release prerelease

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Required release SHA verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck
        run: npm run build
      - name: Desktop harness regression tests
        run: npm run test:desktop:harness
      - name: Backend coverage gate
        run: npm run test:coverage --workspace backend
      - name: UI coverage gate
        run: npm run test:coverage --workspace ui

  build:
    needs: verify
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    # Signing is opt-in and fail-closed: each platform signs only when ALL of its
    # credentials are present, otherwise it falls back to the free default
    # (Windows → unsigned internal candidate; macOS → ad-hoc signature). These
    # job-level flags turn the secret presence into a plain string the step `if:`
    # conditions can read (secrets can't be referenced directly in `if:`).
    env:
      # Free OSS signing via the SignPath Foundation. Set both repo secrets to
      # enable; see docs/development.md (Code signing) for the application + project setup.
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      # Paid Apple Developer ID + notarization. All five secrets must be set.
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_CSC_LINK != '' && secrets.APPLE_CSC_KEY_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend + UI
        run: npm run build

      - name: Stage runtime for packaging
        run: npm run stage --workspace desktop

      - name: Install backend production dependencies
        working-directory: desktop/build/backend
        run: npm ci --omit=dev --workspace backend --include-workspace-root=false --no-audit --no-fund

      - name: Build Windows installer (Azure Trusted Signing)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $signArgs = @()
          $signingKeys = @(
            'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET',
            'AZURE_CODE_SIGNING_ENDPOINT', 'AZURE_CODE_SIGNING_ACCOUNT',
            'AZURE_CODE_SIGNING_PROFILE'
          )
          $configured = @($signingKeys | Where-Object {
            -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($configured.Count -gt 0 -and $configured.Count -ne $signingKeys.Count) {
            throw 'Incomplete Azure Trusted Signing configuration; refusing an unsigned fallback.'
          }
          if ($configured.Count -eq $signingKeys.Count) {
            Write-Host 'Azure Trusted Signing configured — producing a signed installer.'
            $signArgs = @(
              "-c.win.azureSignOptions.endpoint=$env:AZURE_CODE_SIGNING_ENDPOINT",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_CODE_SIGNING_ACCOUNT",
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_CODE_SIGNING_PROFILE"
            )
          } else {
            Write-Host 'Signing intentionally omitted: producing an UNSIGNED INTERNAL candidate, not a production release.'
          }
          npm run dist:win -- @signArgs
        env:
          # Microsoft Entra ID service-principal credentials for Azure Trusted
          # Signing (azure.identity EnvironmentCredential). All absent permits
          # an unsigned internal candidate; partial configuration fails closed.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Non-secret Trusted Signing account identifiers.
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}

      - name: Build macOS installer (ad-hoc signed, unnotarized)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED != 'true'
        working-directory: desktop
        run: npm run dist:mac
        # electron-builder `mac.identity: '-'` (electron-builder.yml) forces an
        # ad-hoc signature with no Developer-ID keychain lookup, so no
        # CSC_IDENTITY_AUTO_DISCOVERY override is needed. Ad-hoc signing keeps
        # Apple Silicon from rejecting the download as "damaged"; the build stays
        # unnotarized and behind the quarantine prompt until real signing lands.
        # This is the free default; the notarized step below replaces it when an
        # Apple Developer ID is configured.

      - name: Build macOS installer (Developer ID signed + notarized)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        working-directory: desktop
        # Overrides the committed ad-hoc `mac.identity: '-'` with a real Developer
        # ID (auto-discovered from the CSC_LINK .p12 electron-builder imports),
        # turns Hardened Runtime on (required for notarization), and submits the
        # app to Apple's notary service via notarytool. Produces a fully signed,
        # notarized, staple-ready DMG with no Gatekeeper prompt. Requires a paid
        # Apple Developer Program membership — see docs/development.md (Code signing).
        run: >
          npm run dist:mac --
          -c.mac.identity="Developer ID Application"
          -c.mac.hardenedRuntime=true
          -c.mac.notarize=true
          -c.dmg.sign=true
        env:
          # Base64-encoded Developer ID Application .p12 and its password.
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          # Apple ID + app-specific password + team for notarytool.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload unsigned Windows installer for SignPath
        id: unsigned-win
        if: runner.os == 'Windows' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Sign Windows installer via SignPath Foundation (free OSS)
        if: runner.os == 'Windows' && env.SIGNPATH_ORGANIZATION_ID != ''
        # Free, Windows-trusted code signing for open-source projects. SignPath
        # pulls the unsigned .exe uploaded above, signs it in their managed
        # workflow (the private key never touches CI), and writes the signed .exe
        # back into desktop/release, overwriting the unsigned one BEFORE the
        # provenance hash is recorded below. The project/policy/artifact slugs
        # must match the SignPath project — see docs/development.md (Code signing). The first signing
        # request may require a one-time manual approval in the SignPath UI.
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ai-project-studio
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.unsigned-win.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/release

      - name: Record internal candidate provenance
        run: node desktop/scripts/release-candidate.cjs

      - name: Upload internal candidate artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ai-project-studio-${{ matrix.label }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
            desktop/release/*.yml
            desktop/release/candidate-*.json
          if-no-files-found: error

  publish-prerelease:
    name: Publish explicitly unqualified prerelease
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download exact candidate artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ai-project-studio-*
          path: artifacts
          merge-multiple: false
      - name: Verify provenance and publish installers without update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const version = require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Release tag/version mismatch');
          for (const platform of ['win32', 'darwin']) {
            const label = platform === 'win32' ? 'Windows' : 'macOS';
            const directory = `artifacts/ai-project-studio-${label}`;
            const manifest = JSON.parse(fs.readFileSync(`${directory}/candidate-${platform}.json`, 'utf8'));
            if (manifest.sourceSha !== process.env.GITHUB_SHA || manifest.version !== version ||
                manifest.ci.runId !== process.env.GITHUB_RUN_ID ||
                manifest.ci.runAttempt !== process.env.GITHUB_RUN_ATTEMPT) {
              throw new Error('Release provenance mismatch');
            }
            for (const artifact of manifest.artifacts) {
              if (!/^[^/\\]+$/.test(artifact.name)) throw new Error('Invalid artifact name');
              const bytes = fs.readFileSync(`${directory}/${artifact.name}`);
              if (bytes.length !== artifact.bytes ||
                  crypto.createHash('sha256').update(bytes).digest('hex') !== artifact.sha256) {
                throw new Error(`Release artifact mismatch: ${artifact.name}`);
              }
            }
          }
          NODE
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" --verify-tag --draft --prerelease \
            --title "$tag (unsigned prerelease)" \
            --notes-file "docs/releases/${tag#v}.md"
          gh release upload "$tag" artifacts/*/*.exe artifacts/*/*.dmg artifacts/*/candidate-*.json
          gh release edit "$tag" --draft=false --prerelease --latest=false
