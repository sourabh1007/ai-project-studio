name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            builder: dist:win
          - os: macos-latest
            label: macOS
            builder: dist:mac
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend + UI
        run: npm run build

      - name: Stage runtime for packaging
        run: npm run stage --workspace desktop

      - name: Install backend production dependencies
        working-directory: desktop/build/backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.builder }}
        env:
          # CI builds are unsigned; do not attempt to auto-discover signing certs.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: copilot-workspace-${{ matrix.label }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
          if-no-files-found: error

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
          fail_on_unmatched_files: false
