name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend + UI
        run: npm run build

      - name: Stage runtime for packaging
        run: npm run stage --workspace desktop

      - name: Install backend production dependencies
        working-directory: desktop/build/backend
        run: npm install --omit=dev --no-audit --no-fund

      - name: Build Windows installer (Azure Trusted Signing)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $signArgs = @()
          if ($env:AZURE_CODE_SIGNING_ENDPOINT) {
            Write-Host 'Azure Trusted Signing configured — producing a signed installer.'
            $signArgs = @(
              "-c.win.azureSignOptions.endpoint=$env:AZURE_CODE_SIGNING_ENDPOINT",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_CODE_SIGNING_ACCOUNT",
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_CODE_SIGNING_PROFILE"
            )
          } else {
            Write-Warning 'AZURE_CODE_SIGNING_* secrets are not set — building an UNSIGNED Windows installer.'
          }
          npm run dist:win -- @signArgs
        env:
          # Microsoft Entra ID service-principal credentials for Azure Trusted
          # Signing (azure.identity EnvironmentCredential). Absent secrets fall
          # back to an unsigned build above rather than failing the release.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Non-secret Trusted Signing account identifiers.
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}

      - name: Build macOS installer (unsigned)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run dist:mac
        env:
          # No Apple Developer Program membership yet; skip signing-cert
          # auto-discovery so the build doesn't fail hunting for an identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ai-project-studio-${{ matrix.label }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
            desktop/release/*.yml
          if-no-files-found: error

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
            desktop/release/*.yml
          fail_on_unmatched_files: false
