plugins {
    id 'com.android.application'
}

def previewVersion = providers.gradleProperty('previewVersion').getOrElse('0.1.0-alpha.1')
def previewVersionCode = providers.gradleProperty('previewVersionCode').getOrElse('1')
if (!(previewVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*/)) {
    throw new GradleException('previewVersion must be an alpha version such as 0.1.0-alpha.1')
}
if (!(previewVersionCode ==~ /[1-9][0-9]{0,8}/)) {
    throw new GradleException('previewVersionCode must be a positive integer of at most nine digits')
}

android {
    namespace 'com.sourabh1007.aiprojectstudio.preview'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.sourabh1007.aiprojectstudio.preview'
        minSdk 26
        targetSdk 35
        versionCode previewVersionCode.toInteger()
        versionName previewVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
