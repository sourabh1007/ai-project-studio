<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Starting AI Project Studio</title>
    <link rel="stylesheet" href="startup.css">
    <script src="startup.js" defer></script>
  </head>
  <body>
    <main class="splash" aria-label="AI Project Studio startup">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>
      <div class="light-sweep" aria-hidden="true"></div>
      <div class="frame-corners" aria-hidden="true"></div>
      <header>
        <button id="close" type="button" aria-label="Close application" title="Close application">&#215;</button>
      </header>
      <section class="identity">
        <div class="emblem">
          <div class="orbit orbit-one" aria-hidden="true"></div>
          <div class="orbit orbit-two" aria-hidden="true"></div>
          <img class="app-icon" src="../build-resources/icon.png" width="156" height="156" alt="AI Project Studio">
          <span class="spark" aria-hidden="true"></span>
        </div>
        <div class="brand">
          <p class="eyebrow">A space for project development using AI</p>
          <h1>AI Project <br><span>Studio.</span></h1>
          <p class="tagline">Your ideas. One workspace.</p>
        </div>
      </section>
      <section class="loading" aria-label="Startup progress">
        <div class="status-row">
          <div class="status" role="status" aria-live="polite" aria-atomic="true">
            <h2 id="status-title">Preparing your workspace</h2>
            <p id="status-detail">Loading desktop settings and application preferences.</p>
          </div>
          <span class="activity" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <ol class="steps" aria-label="Loading stages">
          <li data-step="0" data-state="active" aria-current="step"><span class="step-dot"></span>Desktop</li>
          <li data-step="1" data-state="pending"><span class="step-dot"></span>Local services</li>
          <li data-step="2" data-state="pending"><span class="step-dot"></span>Interface</li>
          <li data-step="3" data-state="pending"><span class="step-dot"></span>Ready</li>
        </ol>
        <div class="loading-track" aria-hidden="true"><div></div></div>
      </section>
      <footer><span id="version">AI Project Studio</span><span id="elapsed">Starting up</span></footer>
    </main>
  </body>
</html>
