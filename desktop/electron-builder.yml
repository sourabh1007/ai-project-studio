appId: com.sourabh1007.aiprojectstudio
productName: AI Project Studio
copyright: Copyright © 2026 sourabh1007

# Electron is hoisted to the monorepo root, so electron-builder can't infer the
# version from desktop/node_modules; pin it explicitly.
electronVersion: 33.2.1

directories:
  output: release
  buildResources: build-resources

# The Electron app itself has no production dependencies (the backend and its
# native node-pty module are shipped as extraResources), so skip app dep rebuild.
npmRebuild: false

# Only the Electron shell itself is packed into the app bundle; the backend and
# UI are shipped as extraResources (see below) and staged by scripts/stage-runtime.mjs.
files:
  - main.cjs
  - preload.cjs
  - update-manager.cjs
  - ipc-input.cjs
  - clipboard.cjs
  - backend-control.cjs
  - backend-identity.cjs
  - startup-splash.cjs
  - startup/**/*
  - owned-attachments.cjs
  - regression-isolation.cjs
  - regression-backend.cjs
  - regression-clipboard.cjs
  - package.json
  - build-resources/icon.png

# Update feed. electron-updater reads release metadata (latest.yml /
# latest-mac.yml) from GitHub Releases. Declaring the provider here makes
# electron-builder emit those metadata files during `dist:*` (even with
# `--publish never`). The candidate workflow retains them as internal artifacts;
# only exact-artifact qualification permits later production promotion.
publish:
  - provider: github
    owner: sourabh1007
    repo: ai-project-studio
    releaseType: draft

# A single from:build/to:. mapping, not one entry per subfolder. electron-builder's
# copy filter unconditionally drops a directory literally named "node_modules"
# sitting at the root of an extraResources `from` path (it assumes that's an
# app-level node_modules it manages separately) — see
# app-builder-lib/src/util/filter.ts createFilter(). Staging installs the
# backend's production dependencies at build/backend/node_modules, so mapping
# `from: build/backend` directly would silently ship a backend with no
# dependencies (see docs/releases/0.11.1.md). Copying the parent `build`
# directory instead makes that path `backend/node_modules` relative to `from`,
# which the filter does not match.
extraResources:
  - from: build
    to: .

# Windows installers are code-signed in CI with Azure Trusted Signing so users
# don't hit the "Unknown Publisher" SmartScreen error on install. The signing
# provider is enabled by the `win.azureSignOptions.*` overrides the Release
# workflow injects at build time (endpoint / account / certificate-profile), with
# Entra ID credentials supplied via AZURE_* env vars — see
# .github/workflows/release.yml and docs/development.md. No signing config is
# committed here, so a local `npm run dist:win` still produces an unsigned build.
win:
  target:
    - nsis
  artifactName: AI-Project-Studio-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: AI-Project-Studio-${version}-mac-${arch}.${ext}

# macOS candidates are unsigned and cannot be promoted to production until
# signing, notarization, and exact-artifact verification are configured.
dmg:
  sign: false
